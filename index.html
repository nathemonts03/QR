<style>
  :root{
    --ink:#14171A;
    --ink-soft:#1B1F23;
    --line:#262B2F;
    --paper:#F2F4F1;
    --slate:#8A939B;
    --phosphor:#4CFFB3;
    --phosphor-dim:rgba(76,255,179,0.28);
    --amber:#FFB454;
    --danger:#FF6B6B;
    --radius:18px;
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:'Space Grotesk', system-ui, sans-serif;
    overscroll-behavior:none;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100%;
    padding-top:var(--safe-t);
    padding-bottom:var(--safe-b);
  }

  /* ---------- Top bar ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 14px;
    position:relative;
    z-index:5;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:17px;
    letter-spacing:-0.01em;
  }
  .brand .mark{
    width:22px; height:22px;
    position:relative;
    flex:none;
  }
  .brand .mark span{
    position:absolute;
    width:7px; height:7px;
    border:2px solid var(--phosphor);
  }
  .brand .mark .tl{top:0;left:0;border-right:0;border-bottom:0;}
  .brand .mark .tr{top:0;right:0;border-left:0;border-bottom:0;}
  .brand .mark .bl{bottom:0;left:0;border-right:0;border-top:0;}
  .brand .mark .br{bottom:0;right:0;border-left:0;border-top:0;}

  .status-pill{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--slate);
    padding:7px 12px;
    border:1px solid var(--line);
    border-radius:100px;
    background:rgba(255,255,255,0.02);
  }
  .status-pill .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--slate);
    transition:background .3s;
  }
  .status-pill.live .dot{
    background:var(--phosphor);
    box-shadow:0 0 8px var(--phosphor);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.45} }

  /* ---------- Scanner stage ---------- */
  .stage{
    position:relative;
    flex:1;
    margin:4px 16px 16px;
    border-radius:28px;
    overflow:hidden;
    background:#0B0D0E;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  #video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:saturate(1.05) contrast(1.03);
  }
  canvas#frame{ display:none; }

  .veil{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 34%, rgba(11,13,14,0.72) 68%);
    pointer-events:none;
  }

  .reticle{
    position:relative;
    width:min(64vw, 280px);
    aspect-ratio:1/1;
    z-index:2;
  }
  .reticle .corner{
    position:absolute;
    width:34px; height:34px;
    border:3px solid var(--phosphor);
    opacity:0.9;
    transition:opacity .25s, border-color .25s;
  }
  .reticle .tl{top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0;}
  .reticle .tr{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0;}
  .reticle .bl{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px;}
  .reticle .br{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0;}

  .scanline{
    position:absolute;
    left:6%; right:6%;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--phosphor), transparent);
    box-shadow:0 0 12px var(--phosphor-dim);
    top:8%;
    animation:sweep 2.6s cubic-bezier(.65,0,.35,1) infinite;
  }
  @keyframes sweep{
    0%   { top:8%; opacity:0; }
    8%   { opacity:1; }
    50%  { top:88%; opacity:1; }
    58%  { opacity:0; }
    100% { top:8%; opacity:0; }
  }

  .reticle.found .corner{ border-color: var(--phosphor); opacity:1; }
  .reticle.found .scanline{ animation:none; opacity:0; }

  .hint{
    position:absolute;
    bottom:22px; left:0; right:0;
    text-align:center;
    z-index:3;
    font-size:13.5px;
    color:var(--slate);
    padding:0 24px;
  }

  .permission-card{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    text-align:center;
    padding:0 34px;
    z-index:6;
    background:#0B0D0E;
  }
  .permission-card.show{ display:flex; }
  .permission-card h2{
    font-size:19px; font-weight:600; letter-spacing:-0.01em;
  }
  .permission-card p{
    color:var(--slate); font-size:14px; line-height:1.55; max-width:280px;
  }

  /* ---------- Bottom controls ---------- */
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:6px 20px 22px;
  }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:14.5px;
    font-weight:600;
    padding:14px 22px;
    border-radius:100px;
    transition:transform .15s ease, background .2s ease, opacity .2s;
  }
  .btn:active{ transform:scale(0.96); }
  .btn-primary{
    background:var(--phosphor);
    color:#08110C;
  }
  .btn-ghost{
    background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
    color:var(--paper);
  }
  .btn-upload{
    width:52px; height:52px; padding:0;
    border-radius:50%;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--line);
    flex:none;
  }
  .btn[disabled]{ opacity:.4; pointer-events:none; }

  #file-input{ display:none; }

  /* ---------- Bottom sheet modal ---------- */
  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(8,9,10,0.6);
    backdrop-filter:blur(2px);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:10;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:11;
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:26px 26px 0 0;
    padding:10px 22px calc(24px + var(--safe-b));
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.32,.72,0,1);
    max-height:82vh;
    overflow-y:auto;
  }
  .sheet-backdrop.open .sheet{ transform:translateY(0); }

  .grabber{
    width:38px; height:4px;
    border-radius:4px;
    background:var(--line);
    margin:6px auto 18px;
  }

  .sheet-kind{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.02em;
    color:var(--phosphor);
    background:rgba(76,255,179,0.1);
    border:1px solid rgba(76,255,179,0.25);
    padding:5px 10px;
    border-radius:100px;
    margin-bottom:14px;
  }
  .sheet-kind.warn{
    color:var(--amber);
    background:rgba(255,180,84,0.1);
    border-color:rgba(255,180,84,0.28);
  }
  .sheet-kind.plain{
    color:var(--slate);
    background:rgba(255,255,255,0.04);
    border-color:var(--line);
  }

  .sheet h3{
    font-size:15px;
    font-weight:500;
    color:var(--slate);
    margin-bottom:6px;
  }

  .url-box{
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    line-height:1.6;
    word-break:break-all;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    color:var(--paper);
    margin-bottom:8px;
    max-height:160px;
    overflow-y:auto;
  }

  .domain-row{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--slate);
    font-size:13px;
    margin-bottom:22px;
  }
  .domain-row strong{ color:var(--paper); font-weight:600; }

  .sheet-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .sheet-actions .btn{ width:100%; padding:15px 22px; }

  .row-actions{
    display:flex;
    gap:10px;
    margin-top:2px;
  }
  .row-actions .btn{ flex:1; }

  .copied-toast{
    position:fixed;
    left:50%;
    bottom:calc(28px + var(--safe-b));
    transform:translate(-50%, 12px);
    background:var(--paper);
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    padding:10px 18px;
    border-radius:100px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:20;
  }
  .copied-toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){
    .scanline, .status-pill.live .dot{ animation:none !important; }
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></span>
    Lookout
  </div>
  <div class="status-pill" id="status-pill">
    <span class="dot"></span>
    <span id="status-text">Starting camera</span>
  </div>
</header>

<div class="stage" id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="frame"></canvas>
  <div class="veil"></div>

  <div class="reticle" id="reticle">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scanline"></div>
  </div>

  <p class="hint" id="hint">Point the camera at a QR code</p>

  <div class="permission-card" id="permission-card">
    <h2>Camera access needed</h2>
    <p id="permission-text">Lookout reads QR codes through your camera. Allow access, or drop in an image instead.</p>
    <button class="btn btn-primary" id="retry-camera">Try again</button>
  </div>
</div>

<div class="controls">
  <button class="btn btn-upload" id="upload-btn" title="Scan from image" aria-label="Scan from image">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M12 16V4M12 4L7 9M12 4l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="btn btn-ghost" id="toggle-cam">Flip camera</button>
  <input type="file" id="file-input" accept="image/*" />
</div>

<!-- Result sheet -->
<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grabber"></div>
    <span class="sheet-kind" id="sheet-kind">LINK DETECTED</span>
    <h3 id="sheet-title">This code points to</h3>
    <div class="url-box" id="url-box">—</div>
    <div class="domain-row" id="domain-row" style="display:none;">
      Destination domain: <strong id="domain-text">—</strong>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="open-link">Open link</button>
      <div class="row-actions">
        <button class="btn btn-ghost" id="copy-link">Copy URL</button>
        <button class="btn btn-ghost" id="scan-again">Scan again</button>
      </div>
    </div>
  </div>
</div>

<div class="copied-toast" id="copied-toast">Copied to clipboard</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script>
(function(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('frame');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const reticle = document.getElementById('reticle');
  const hint = document.getElementById('hint');
  const statusPill = document.getElementById('status-pill');
  const statusText = document.getElementById('status-text');
  const permissionCard = document.getElementById('permission-card');
  const permissionText = document.getElementById('permission-text');
  const retryBtn = document.getElementById('retry-camera');
  const toggleCamBtn = document.getElementById('toggle-cam');
  const uploadBtn = document.getElementById('upload-btn');
  const fileInput = document.getElementById('file-input');

  const sheetBackdrop = document.getElementById('sheet-backdrop');
  const sheetKind = document.getElementById('sheet-kind');
  const sheetTitle = document.getElementById('sheet-title');
  const urlBox = document.getElementById('url-box');
  const domainRow = document.getElementById('domain-row');
  const domainText = document.getElementById('domain-text');
  const openLinkBtn = document.getElementById('open-link');
  const copyLinkBtn = document.getElementById('copy-link');
  const scanAgainBtn = document.getElementById('scan-again');
  const copiedToast = document.getElementById('copied-toast');

  let stream = null;
  let rafId = null;
  let scanning = true;
  let facingMode = 'environment';
  let lastResult = '';

  function setStatus(text, live){
    statusText.textContent = text;
    statusPill.classList.toggle('live', !!live);
  }

  // Progressively looser constraint sets. Some cameras/browsers reject the
  // ideal width/height/facingMode combo outright (OverconstrainedError) even
  // though a plain "give me any camera" request would succeed.
  function constraintAttempts(){
    return [
      { video: { facingMode: { ideal: facingMode }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false },
      { video: { facingMode: { ideal: facingMode } }, audio:false },
      { video: true, audio:false }
    ];
  }

  async function startCamera(){
    stopCamera();
    permissionCard.classList.remove('show');
    setStatus('Starting camera', false);

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setStatus('No camera', false);
      permissionText.textContent = 'This browser has no camera API available. You can still scan from an image.';
      permissionCard.classList.add('show');
      return;
    }

    let lastErr = null;
    let gotStream = null;
    for(const constraints of constraintAttempts()){
      try{
        gotStream = await navigator.mediaDevices.getUserMedia(constraints);
        break;
      }catch(err){
        lastErr = err;
        if(!err || err.name !== 'OverconstrainedError') break;
      }
    }

    if(!gotStream){
      setStatus('No camera', false);
      permissionText.textContent = describeCameraError(lastErr);
      permissionCard.classList.add('show');
      return;
    }

    // Camera acquired — anything that goes wrong from here on (video
    // playback, the scan loop) is a separate concern and must never be
    // reported as a camera-access problem.
    stream = gotStream;
    video.srcObject = stream;
    try{
      await video.play();
    }catch(e){ /* some browsers throw if play() races a pause(); safe to ignore */ }
    setStatus('Live', true);
    hint.textContent = 'Point the camera at a QR code';
    scanning = true;
    tick();
  }

  function describeCameraError(err){
    const name = err && err.name;
    switch(name){
      case 'NotAllowedError':
      case 'PermissionDeniedError':
        return 'Camera access was denied. Enable it in your browser settings, or scan from an image instead.';
      case 'NotFoundError':
      case 'DevicesNotFoundError':
        return 'No camera was found. Check your OS camera privacy settings allow this browser, or scan from an image instead.';
      case 'NotReadableError':
      case 'TrackStartError':
        return 'The camera is in use by another app or tab. Close it and try again, or scan from an image instead.';
      case 'OverconstrainedError':
        return 'The camera could not meet the requested settings. Try flipping the camera, or scan from an image instead.';
      case 'SecurityError':
        return 'This page must be served over HTTPS (or localhost) for the camera to work.';
      default:
        return 'No camera could be reached' + (name ? ' (' + name + ')' : '') + '. You can still scan from an image.';
    }
  }

  function stopCamera(){
    if(rafId) cancelAnimationFrame(rafId);
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  }

  function tick(){
    if(!scanning) return;
    if(typeof jsQR === 'undefined'){
      scanning = false;
      setStatus('Scan unavailable', false);
      hint.textContent = 'QR reader failed to load — check your connection and reload';
      return;
    }
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts:'dontInvert' });
      if(code && code.data){
        handleResult(code.data);
        return;
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function handleResult(data){
    if(!data || data === lastResult && sheetBackdrop.classList.contains('open')) return;
    lastResult = data;
    scanning = false;
    reticle.classList.add('found');
    if(navigator.vibrate) navigator.vibrate(40);
    setTimeout(()=> showSheet(data), 180);
  }

  function classify(data){
    try{
      const url = new URL(data);
      const isHttp = url.protocol === 'http:' || url.protocol === 'https:';
      return { isUrl:isHttp, url: isHttp ? url : null };
    }catch(e){
      return { isUrl:false, url:null };
    }
  }

  function showSheet(data){
    const { isUrl, url } = classify(data);
    urlBox.textContent = data;

    if(isUrl){
      sheetKind.textContent = url.protocol === 'https:' ? 'SECURE LINK' : 'UNSECURED LINK';
      sheetKind.className = 'sheet-kind' + (url.protocol === 'https:' ? '' : ' warn');
      sheetTitle.textContent = 'This code points to';
      domainRow.style.display = 'flex';
      domainText.textContent = url.hostname;
      openLinkBtn.style.display = 'inline-flex';
      openLinkBtn.textContent = 'Open link';
    }else{
      sheetKind.textContent = 'TEXT CONTENT';
      sheetKind.className = 'sheet-kind plain';
      sheetTitle.textContent = 'This code contains';
      domainRow.style.display = 'none';
      openLinkBtn.style.display = 'none';
    }

    sheetBackdrop.classList.add('open');
  }

  function closeSheet(){
    sheetBackdrop.classList.remove('open');
    setTimeout(()=>{
      reticle.classList.remove('found');
      scanning = true;
      tick();
    }, 280);
  }

  openLinkBtn.addEventListener('click', ()=>{
    window.open(lastResult, '_blank', 'noopener,noreferrer');
  });

  copyLinkBtn.addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(lastResult);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = lastResult; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    copiedToast.classList.add('show');
    setTimeout(()=> copiedToast.classList.remove('show'), 1500);
  });

  scanAgainBtn.addEventListener('click', closeSheet);
  sheetBackdrop.addEventListener('click', (e)=>{ if(e.target === sheetBackdrop) closeSheet(); });

  retryBtn.addEventListener('click', startCamera);

  toggleCamBtn.addEventListener('click', ()=>{
    facingMode = (facingMode === 'environment') ? 'user' : 'environment';
    startCamera();
  });

  uploadBtn.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const img = new Image();
    img.onload = ()=>{
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if(code && code.data){
        handleResult(code.data);
      }else{
        hint.textContent = "Couldn't find a QR code in that image";
        setTimeout(()=> hint.textContent = 'Point the camera at a QR code', 2200);
      }
    };
    img.src = URL.createObjectURL(file);
    fileInput.value = '';
  });

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ stopCamera(); }
    else if(!sheetBackdrop.classList.contains('open')){ startCamera(); }
  });
